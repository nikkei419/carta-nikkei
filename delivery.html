<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DELIVERY — NIKKEI 419</title>

  <!-- Fuente branding -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg:#0a0a0a;
    --card:#121212;
    --line:#1f1f1f;
    --text:#f5f5f5;
    --muted:#cfcfcf;
    --accent:#9C222A;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:16px;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  h1,h2,h3,h4,h5,h6{
    font-family:'Cinzel',serif;
    letter-spacing:1px;
    font-weight:700;
  }

  /* ================= TOP BAR ================= */
  .top{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(10,10,10,.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    height:60px;
    display:flex;
    align-items:center;
  }

  .wrap{
    max-width:1000px;
    margin:0 auto;
    width:100%;
    padding:0 16px;
    display:grid;
    grid-template-columns:40px 1fr 40px;
    align-items:center;
  }

  .menu-icon{
    border:1px solid #fff;
    border-radius:10px;
    padding:6px 9px;
    background:#0f0f0f;
    color:#fff;
    font-size:18px;
    cursor:pointer;
  }
  .menu-icon:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  .center-logo{
    display:flex;
    justify-content:center;
  }
  .center-logo img{
    height:48px;
    transform:scale(1.1);
  }

  .back-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    opacity:.9;
  }
  .back-icon:hover{ color:var(--accent); }

  /* ================= DRAWER ================= */
  .drawer{ display:none; }
  .drawer.open{ display:block; }
  .drawer .sheet{
    background:#0e0e0e;
    border-top:1px solid #1c1c1c;
  }
  .drawer a{
    display:block;
    padding:14px 20px;
    border-bottom:1px solid #161616;
  }

  /* ================= PAGE ================= */
  .page{
    max-width:1200px;
    margin:0 auto;
    padding:18px 16px 32px;
  }
  .sub{ color:var(--muted); font-size:14px; }

  /* ================= DELIVERY ================= */
  .delivery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:14px;
  }
  @media (max-width:860px){
    .delivery-grid{ grid-template-columns:1fr; }
  }

  .delivery-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    transition:.15s ease;
  }
  .delivery-card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
  }

  .delivery-icon{
    width:56px;
    height:56px;
    border-radius:14px;
    background:#0f0f0f;
    border:1px solid rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .delivery-icon img{
    width:70%;
    height:70%;
    object-fit:contain;
  }

  /* ✅ SOLO WHATSAPP MÁS GRANDE */
  .delivery-card.is-whatsapp .delivery-icon{
    width:64px;
    height:64px;
  }
  .delivery-card.is-whatsapp .delivery-icon img{
    width:85%;
    height:85%;
  }

  .delivery-info{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .delivery-title{
    font-weight:700;
    font-size:16px;
  }
  .delivery-desc{
    font-size:13px;
    color:var(--muted);
    margin:0;
  }
  .delivery-cta{
    margin-left:auto;
    color:var(--accent);
    font-weight:700;
    font-size:13px;
  }

  /* ================= FOOTER ================= */
  footer{
    border-top:1px solid #1b1b1b;
    background:#0a0a0a;
    margin-top:26px;
  }
  .footer{
    max-width:1100px;
    margin:0 auto;
    padding:24px 20px;
  }
  .foot-row{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .foot-small{ font-size:13px; color:#9f9f9f; }
  </style>
</head>

<body>

<div class="top">
  <div class="wrap">
    <button class="menu-icon" id="burger">☰</button>
    <div class="center-logo">
      <img src="logos/logotipo4.png" alt="NIKKEI 419">
    </div>
    <a href="index.html" class="back-icon">→]</a>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="sheet">
    <a href="index.html" class="drawer-link">Inicio</a>
    <a href="comida.html" class="drawer-link">Comida</a>
    <a href="bebestibles.html" class="drawer-link">Bebestibles</a>
    <a href="delivery.html" class="drawer-link">Delivery</a>
  </div>
</div>

<main class="page">
  <h1>Delivery</h1>
  <p class="sub">Elige tu plataforma y pide directo.</p>

  <div class="delivery-grid">

    <!-- UBER -->
    <a class="delivery-card" href="#" target="_blank">
      <div class="delivery-icon">
        <img src="icons/uber-eats.png" alt="Uber Eats">
      </div>
      <div class="delivery-info">
        <div class="delivery-title">Uber Eats</div>
        <p class="delivery-desc">Pide desde la app y recibe en minutos.</p>
      </div>
      <div class="delivery-cta">Abrir</div>
    </a>

    <!-- RAPPI -->
    <a class="delivery-card" href="#" target="_blank">
      <div class="delivery-icon">
        <img src="icons/rappi.png" alt="Rappi">
      </div>
      <div class="delivery-info">
        <div class="delivery-title">Rappi</div>
        <p class="delivery-desc">Delivery rápido con seguimiento en vivo.</p>
      </div>
      <div class="delivery-cta">Abrir</div>
    </a>

    <!-- ✅ WHATSAPP -->
    <a class="delivery-card is-whatsapp" href="https://wa.me/56944049798" target="_blank">
      <div class="delivery-icon">
        <img src="icons/whatsapp.png" alt="WhatsApp">
      </div>
      <div class="delivery-info">
        <div class="delivery-title">WhatsApp</div>
        <p class="delivery-desc">Pedido directo con atención personalizada.</p>
      </div>
      <div class="delivery-cta">Escribir</div>
    </a>

  </div>
</main>

<script>
  const burger = document.getElementById('burger');
  const drawer = document.getElementById('drawer');

  burger.addEventListener('click', () => {
    drawer.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!drawer.contains(e.target) && !burger.contains(e.target)) {
      drawer.classList.remove('open');
    }
  });
</script>

</body>
</html>
