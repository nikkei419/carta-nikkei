<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DELIVERY — NIKKEI 419</title>

  <!-- Fuente branding -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0a0a0a;
      --card:#121212;
      --line:#1f1f1f;
      --text:#f5f5f5;
      --accent:#9C222A;
      --radius:18px;
      --shadow:0 10px 30px rgba(0,0,0,.4);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;
    }

    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    /* ================= TOP BAR ================= */
    .top{
      position:sticky;
      top:0;
      z-index:50;
      height:64px;
      background:rgba(10,10,10,.9);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 16px;
      width:100%;
      display:grid;
      grid-template-columns:48px 1fr 48px;
      align-items:center;
    }

    .menu-icon{
      width:44px;
      height:44px;
      border-radius:12px;
      border:1.5px solid rgba(255,255,255,.3);
      background:#0f0f0f;
      color:#fff;
      font-size:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.2s;
    }

    .menu-icon:hover{
      border-color:var(--accent);
      color:var(--accent);
    }

    .logo{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo img{
      height:48px;
      border-radius:12px;
    }

    .back{
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:26px;
      opacity:.9;
      transition:.2s;
    }

    .back:hover{
      color:var(--accent);
    }

    /* ================= DRAWER ================= */
    .drawer{
      display:none;
      background:#0e0e0e;
      border-bottom:1px solid var(--line);
    }

    .drawer.open{display:block}

    .drawer a{
      display:block;
      padding:14px 20px;
      border-bottom:1px solid #161616;
    }

    /* ================= DELIVERY ================= */
    main{
      max-width:900px;
      margin:0 auto;
      padding:32px 16px;
    }

    h1{
      font-family:'Cinzel',serif;
      text-align:center;
      font-size:22px;
      letter-spacing:2px;
      margin-bottom:26px;
    }

    .delivery-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .delivery-box{
      height:80px;
      background:var(--card);
      border:1.5px solid rgba(255,255,255,.18);
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:var(--shadow);
      transition:.25s;
    }

    .delivery-box img{
      max-height:42px;
      max-width:60%;
      object-fit:contain;
    }

    .delivery-box:hover{
      transform:translateY(-2px);
      border-color:var(--accent);
    }

    /* Mobile */
    @media(max-width:640px){
      .delivery-grid{
        grid-template-columns:1fr;
      }

      .delivery-box{
        height:100px;
      }

      .delivery-box img{
        max-height:44px;
      }
    }

    /* ================= FOOTER ================= */
    footer{
      border-top:1px solid var(--line);
      background:#0a0a0a;
      margin-top:40px;
    }

    .footer{
      max-width:1100px;
      margin:0 auto;
      padding:24px 20px;
      display:grid;
      gap:14px;
    }

    .foot-row{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:10px;
    }

    .foot-small{
      color:#9f9f9f;
      font-size:13px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="top">
    <div class="wrap">
      <button id="menuBtn" class="menu-icon">☰</button>

      <div class="logo">
        <img src="logo-nikkei.png" alt="NIKKEI 419">
      </div>

      <a href="index.html" class="back" aria-label="Volver">→]</a>
    </div>
  </div>

  <!-- DRAWER -->
  <div id="drawer" class="drawer">
    <a href="index.html">Inicio</a>
    <a href="comida.html">Comida</a>
    <a href="bebestibles.html">Bebestibles</a>
  </div>

  <!-- DELIVERY -->
  <main>
    <h1>Pide por delivery</h1>

    <div class="delivery-grid">

      <a href="PON_AQUI_TU_LINK_UBER"
         target="_blank"
         class="delivery-box">
        <img src="icons/uber-eats.png" alt="Uber Eats">
      </a>

      <a href="PON_AQUI_TU_LINK_RAPPI"
         target="_blank"
         class="delivery-box">
        <img src="icons/rappi.png" alt="Rappi">
      </a>

      <a href="https://wa.me/569XXXXXXXX"
         target="_blank"
         class="delivery-box">
        <img src="icons/whatsapp.png" alt="WhatsApp">
      </a>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer">
      <div class="foot-row">
        <span class="foot-small">© <span id="year"></span> NIKKEI 419</span>
        <span class="foot-small">Viña del Mar, Chile</span>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const menuBtn = document.getElementById('menuBtn');
    const drawer = document.getElementById('drawer');

    menuBtn.addEventListener('click', () => {
      drawer.classList.toggle('open');
    });
  </script>

</body>
</html>
